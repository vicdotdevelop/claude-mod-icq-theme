name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned to the version the mods are tested against; bump deliberately.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Syntax-check scripts
        run: node --check scripts/lib.mjs && node --check scripts/new-mod.mjs && node --check scripts/check.mjs && node --check scripts/dev-link.mjs && node --check scripts/make-chime.mjs
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate and test every mod
        run: node scripts/check.mjs
      - name: Scaffolder produces a valid mod
        shell: bash
        run: |
          node scripts/new-mod.mjs ci-smoke "CI smoke test" --theme
          node scripts/check.mjs ci-smoke
